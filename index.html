<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #fffaf0;
      color: #333333;
    }
    .card {
      background: #ffffff;
      border: 1px solid #f0d9a8;
      box-shadow: 0 8px 24px rgba(180, 130, 40, 0.12);
    }
    .label {
      color: #d97706;
    }
    h1, h2 {
      color: #4b5563;
    }
    .lead {
      color: #5b6470;
    }
    .edit-me {
      background: #fff7d6;
      border: 1px solid #f6d365;
    }
    #message {
      color: #7c4a03;
    }
    footer {
      color: #6b7280;
    }
    .badge {
      background: #fbbf24;
      color: #4b3200;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
