<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #111111;
      color: #eeeeee;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333333;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .label {
      color: #aaaaaa;
    }
    h1, h2 {
      color: #ffffff;
    }
    .lead {
      color: #cccccc;
    }
    .edit-me {
      background: #262626;
      border: 1px solid #444444;
    }
    #message {
      color: #eeeeee;
    }
    footer {
      color: #999999;
    }
    .badge {
      background: #444444;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
